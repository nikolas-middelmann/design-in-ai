<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>szene 7 – design in ai</title>
  <link rel="stylesheet" href="../stil.css">
</head>
<body>

  <!-- Welche Szene dieses Blatt zeigt: nur diese Pfade ändern (data-usdz fürs iPhone, data-glb und data-ton für Android) -->
  <!-- Szene 7, Fassung 3: Kulisse K25 „Spirale“, zweite Fassung – Weg, Gang, Stehen, Spot und Stimme wie Fassung 2;
       statt der Stroboskop-Standbilder drei Nachbilder direkt in der Figur, die nacheinander in ihr aufgehen; über der
       Mitte wächst in acht Schüben ein Gedankenkonstrukt aus Leuchtlinien und Knoten, gespeist von Funken, die vom Kopf
       aufsteigen; nach dem Text fällt es in sich zusammen, und er geht wieder hinaus.
       Frühere Fassungen: ../modell/szene7_v2.usdz (Stroboskop-Standbilder), ../modell/szene7.usdz (ohne Kulisse) -->
  <!-- Android (Scene Viewer): GLB aus der iPhone-Datei umgewandelt (usdz_zu_glb.py), Ton getrennt als MP3 (data-ton) -->
  <main id="blatt"
        data-usdz="../modell/szene7_v3.usdz"
        data-glb="../modell/szene7_v3.glb"
        data-ton="../modell/szene7_ton.mp3">

    <p class="projekt">design in ai</p>
    <p class="nummer">07</p>
    <h1>szene 7</h1>

    <button id="ar-knopf" type="button" hidden>im raum ansehen</button>
    <p id="hinweis"></p>
    <p class="copyright">© Nikolas Middelmann</p>
  </main>

  <script src="../ar.js"></script>
</body>
</html>
