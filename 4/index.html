<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>szene 4 – design in ai</title>
  <link rel="stylesheet" href="../stil.css">
</head>
<body>

  <!-- Welche Szene dieses Blatt zeigt: nur diese Pfade ändern (data-usdz fürs iPhone, data-glb und data-ton für Android) -->
  <!-- Szene 4, Fassung 3: Kulisse K22 „Buch“, zweite Fassung – doppelt so groß (5,2 m), Titel linksbündig, © unten rechts;
       das Buch atmet und wabert, Lichtsaum, Strahlen im Takt der Stimme, Zeilen strömen heraus, Stapel älterer Fassungen,
       der Schatten hinterlässt Spuren. Frühere Fassungen: ../modell/szene4_v2.usdz (Buch mit Schatten),
       ../modell/szene4.usdz (ohne Kulisse) -->
  <!-- Android (Scene Viewer): GLB aus der iPhone-Datei umgewandelt (usdz_zu_glb.py), Ton getrennt als MP3 (data-ton) -->
  <main id="blatt"
        data-usdz="../modell/szene4_v3.usdz"
        data-glb="../modell/szene4_v3.glb"
        data-ton="../modell/szene4_ton.mp3">

    <p class="projekt">design in ai</p>
    <p class="nummer">04</p>
    <h1>szene 4</h1>

    <button id="ar-knopf" type="button" hidden>im raum ansehen</button>
    <p id="hinweis"></p>
    <p class="copyright">© Nikolas Middelmann</p>
  </main>

  <script src="../ar.js"></script>
</body>
</html>
